services:
  backend:
    build:
      context: . # 1. Set build context to repo root
      dockerfile: backend/Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017/realtime-whiteboard
      CHOKIDAR_USEPOLLING: "true"
    container_name: whiteboard-api

    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    volumes:
      - ./:/app # Mounts backend code to /app
      - /app/node_modules

    command: sh -c "npm run build --workspace=@whiteboard/common && npm run start-dev --workspace=backend"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: whiteboard-frontend

    working_dir: /app/frontend

    ports:
      - "5173:5173"

    volumes:
      - ./:/app
      - /app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - backend

    command: npm run dev -- --host 0.0.0.0

  mongo:
    image: mongo:8

    restart: unless-stopped

    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
