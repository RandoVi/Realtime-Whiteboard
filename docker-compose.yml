services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: mongodb://mongo:27017/realtime-whiteboard
      CHOKIDAR_USEPOLLING: "true"
    container_name: whiteboard-api

    ports:
      - "3000:3000"
    depends_on:
      - mongo
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/common/dist
      - /app/backend/dist

    command: sh -c "npm run build --workspace=@whiteboard/common && npm run start-dev --workspace=backend"

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/frontend/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

  mongo:
    image: mongo:8

    restart: unless-stopped

    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
